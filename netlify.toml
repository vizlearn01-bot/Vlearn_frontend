[build]
  publish = "dist"
  command = "vite build"

# 1. Proxy public knowledge base root (/knowledge) directly to Django backend
[[redirects]]
  from = "/knowledge"
  to = "https://vlearn-backend-4y9z.onrender.com/knowledge/"
  status = 200
  force = true

# 2. Proxy public knowledge articles and subpaths (/knowledge/*) to Django backend
[[redirects]]
  from = "/knowledge/*"
  to = "https://vlearn-backend-4y9z.onrender.com/knowledge/:splat"
  status = 200
  force = true

# 3. Proxy sitemap.xml to Django backend
[[redirects]]
  from = "/sitemap.xml"
  to = "https://vlearn-backend-4y9z.onrender.com/sitemap.xml"
  status = 200
  force = true

# 4. Proxy robots.txt to Django backend
[[redirects]]
  from = "/robots.txt"
  to = "https://vlearn-backend-4y9z.onrender.com/robots.txt"
  status = 200
  force = true

# 5. SPA fallback for all remaining routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
