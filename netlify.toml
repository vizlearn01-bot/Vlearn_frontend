[build]
  publish = "dist"
  command = "vite build"

# 1. Normalize bare /knowledge to trailing slash for canonical SEO & proxy matching
[[redirects]]
  from = "/knowledge"
  to = "/knowledge/"
  status = 301
  force = true

# 2. Proxy public knowledge articles to Django backend
[[redirects]]
  from = "/knowledge/*"
  to = "https://api.vizlearn.co/knowledge/:splat"
  status = 200
  force = true

# Proxy sitemap.xml to Django backend
[[redirects]]
  from = "/sitemap.xml"
  to = "https://api.vizlearn.co/sitemap.xml"
  status = 200
  force = true

# Proxy robots.txt to Django backend
[[redirects]]
  from = "/robots.txt"
  to = "https://api.vizlearn.co/robots.txt"
  status = 200
  force = true

# SPA fallback for all remaining routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
